name: itk_app
description: Flutter client for test.app.itk.ppke.hu
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.2

  material_ui: any
  go_router: ^18.0.0
  icalendar_parser: ^2.1.0
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  kalender: ^0.32.0
  calendar_view: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex[wght,wdth,ROND].ttf
