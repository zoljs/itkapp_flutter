name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      # Infos (deprecated material.dart imports) are not fatal until the
      # material_ui / cupertino_ui migration; errors and warnings still fail.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test